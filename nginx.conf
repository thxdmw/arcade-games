server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # FBNeo 的线程核心依赖 SharedArrayBuffer，这三个响应头必须由最外层代理保留。
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Embedder-Policy require-corp always;
    add_header Cross-Origin-Resource-Policy same-origin always;

    gzip on;
    gzip_min_length 1k;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    types {
        text/html html;
        text/css css;
        text/javascript js mjs;
        application/json json webmanifest;
        application/wasm wasm;
        application/octet-stream data;
        application/zip zip;
        image/svg+xml svg;
        image/x-icon ico;
        image/webp webp;
        image/png png;
        image/jpeg jpg jpeg;
    }

    location = /index.html {
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
        add_header Cross-Origin-Resource-Policy same-origin always;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location = /play.html {
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
        add_header Cross-Origin-Resource-Policy same-origin always;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # 标准根路径方便浏览器、搜索引擎和外部站点发现；仅图标允许跨域读取。
    location = /favicon.ico {
        alias /usr/share/nginx/html/assets/favicon.ico;
        add_header Cross-Origin-Resource-Policy cross-origin always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=2592000" always;
        access_log off;
    }

    # 每个游戏目录自带主 ROM、父 ROM、BIOS 和封面，前端逐层读取 JSON 目录索引。
    location /runtime/ {
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
        add_header Cross-Origin-Resource-Policy same-origin always;
        add_header Cache-Control "no-store";
        autoindex on;
        autoindex_format json;
        try_files $uri =404;
    }

    location /emulatorjs/ {
        expires 30d;
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
        add_header Cross-Origin-Resource-Policy same-origin always;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
