server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # FBNeo 的线程核心依赖 SharedArrayBuffer，这三个响应头必须由最外层代理保留。
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Embedder-Policy require-corp always;
    add_header Cross-Origin-Resource-Policy same-origin always;

    gzip on;
    gzip_min_length 1k;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    types {
        text/html html;
        text/css css;
        text/javascript js mjs;
        application/json json webmanifest;
        application/wasm wasm;
        application/octet-stream data;
        application/zip zip;
        image/svg+xml svg;
        image/webp webp;
        image/png png;
        image/jpeg jpg jpeg;
    }

    location = /index.html {
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
        add_header Cross-Origin-Resource-Policy same-origin always;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location = /play.html {
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
        add_header Cross-Origin-Resource-Policy same-origin always;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # 浏览器从只读目录索引发现 ROM；响应只包含文件名等元数据，不读取压缩包内容。
    location = /roms/ {
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
        add_header Cross-Origin-Resource-Policy same-origin always;
        add_header Cache-Control "no-store";
        autoindex on;
        autoindex_format json;
    }

    location /emulatorjs/ {
        expires 30d;
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
        add_header Cross-Origin-Resource-Policy same-origin always;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # EmulatorJS 保留 BIOS/父 ROM 压缩包时会按文件名从根路径请求；只允许单层 ZIP 名称。
    location ~ ^/(?<archive>[^/]+\.zip)$ {
        expires 1h;
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
        add_header Cross-Origin-Resource-Policy same-origin always;
        add_header Cache-Control "private, must-revalidate";
        try_files /bios/$archive /roms/$archive =404;
    }

    # ROM 和 BIOS 可能沿用原文件名更新，保留 ETag 复验而不使用 immutable。
    location ~* ^/(roms|bios|covers)/ {
        expires 1h;
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
        add_header Cross-Origin-Resource-Policy same-origin always;
        add_header Cache-Control "private, must-revalidate";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
