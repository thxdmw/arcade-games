services:
  arcade-games:
    build: .
    image: arcade-games:local
    container_name: arcade-games-web
    restart: unless-stopped
    ports:
      - "${ARCADE_HOST_PORT:-20001}:80"
    volumes:
      - "${ARCADE_DATA_DIR:-./runtime}:/usr/share/nginx/html/runtime:ro"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/runtime/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
