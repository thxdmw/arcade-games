kind: pipeline
name: arcade-games-deploy

platform:
  os: linux
  arch: amd64

steps:
  - name: verify
    image: node:22-alpine
    commands:
      - npm ci --omit=optional
      - npm run prepare:emulator
      - npm test
      - npm run check

  - name: deploy
    image: appleboy/drone-ssh
    depends_on:
      - verify
    settings:
      host:
        from_secret: ssh_host
      port:
        from_secret: ssh_port
      username:
        from_secret: ssh_username
      password:
        from_secret: ssh_password

      # SSH 建连最多等 15 秒
      timeout: 15s

      # SSH 连接成功以后，远程脚本最多跑 30 分钟
      command_timeout: 30m

      script:
        - set -eu
        - echo "===== deploy start ====="
        - whoami
        - hostname
        - date
        - sudo mkdir -p /app/arcade-games
        - |
          if [ ! -d "/app/arcade-games/arcade-games/.git" ]; then
            echo "首次部署：从 Gitee 克隆仓库"
            sudo git clone --origin origin --branch master \
              https://gitee.com/tang-haixin/arcade-games.git \
              /app/arcade-games/arcade-games
          fi
        - cd /app/arcade-games/arcade-games
        - echo "===== git fetch ====="
        - sudo git fetch --prune origin master
        - echo "===== git checkout ${DRONE_COMMIT_SHA} ====="
        - sudo git checkout --force --detach ${DRONE_COMMIT_SHA}
        - echo "===== deploy.sh ====="
        - sudo env DEPLOY_RELEASE_TAG=${DRONE_COMMIT_SHA} bash ./deploy.sh
        - echo "===== deploy finished ====="

  - name: notify-pushplus
    image: curlimages/curl:8.12.1
    depends_on:
      - deploy
    failure: ignore
    environment:
      PUSHPLUS_TOKEN:
        from_secret: pushplus_token
    commands:
      - |
        STATUS="$${DRONE_STAGE_STATUS:-$${DRONE_BUILD_STATUS}}"
        if [ "$${STATUS}" = "success" ]; then RESULT="成功"; else RESULT="失败"; fi
        curl --fail --show-error --silent --request POST "https://www.pushplus.plus/send" \
          --data-urlencode "token=$${PUSHPLUS_TOKEN}" \
          --data-urlencode "title=Drone：$${DRONE_REPO_NAME} #$${DRONE_BUILD_NUMBER} $${RESULT}" \
          --data-urlencode "content=<b>流水线：</b>$${DRONE_STAGE_NAME}<br><b>状态：</b>$${RESULT}<br><b>分支：</b>$${DRONE_COMMIT_BRANCH}<br><b>提交：</b>$${DRONE_COMMIT_SHA}<br><b>提交人：</b>$${DRONE_COMMIT_AUTHOR}<br><a href='$${DRONE_BUILD_LINK}'>打开 Drone 构建详情</a>" \
          --data-urlencode "template=html" \
          --data-urlencode "channel=wechat"
    when:
      status:
        - success
        - failure
trigger:
  event:
    - push
  branch:
    - master
