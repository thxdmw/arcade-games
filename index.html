<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f3f0e8">
    <meta name="description" content="纯前端、自托管的网页街机厅">
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="stylesheet" href="/assets/styles.css">
    <title>方方街机</title>
  </head>
  <body class="home-page">
    <div class="noise" aria-hidden="true"></div>
    <header class="site-header">
      <a class="brand" href="/" aria-label="返回方方街机首页">
        <img src="/assets/favicon.ico" alt="" width="44" height="44">
        <span><b>方方街机</b></span>
      </a>
      <div class="header-library" aria-label="游戏库工具栏">
        <div class="filter-list" id="filters" aria-label="游戏分类"></div>
        <div class="header-tools">
          <label class="search-box">
            <span aria-hidden="true">⌕</span>
            <span class="sr-only">搜索游戏</span>
            <input id="search" type="search" placeholder="搜索游戏…" autocomplete="off">
          </label>
          <button class="refresh-games" id="refresh-games" type="button"><span aria-hidden="true">↻</span> 刷新</button>
          <span class="catalog-status" id="catalog-status"><i class="status-dot"></i>自动发现已开启</span>
          <div class="header-status" id="storage-status">
            <span class="status-dot"></span>
            <span>本地存档已启用</span>
          </div>
          <button class="theme-toggle" id="theme-toggle" type="button" aria-label="切换到暗色模式">
            <span aria-hidden="true">☾</span><small>暗色</small>
          </button>
        </div>
      </div>
    </header>

    <main class="home-main">
      <section class="arcade-layout">
        <div class="machine-zone">
          <div class="machine-status">
            <span><i></i> LIVE COLLECTION</span>
            <strong><b id="machine-game-count">0</b> 款游戏在线</strong>
            <small>将鼠标移到游戏卡片上即可预览</small>
          </div>

          <section class="hero-machine interactive-machine" id="interactive-machine" tabindex="0" aria-label="街机选台，使用左右方向键换游戏，按回车开始">
            <div class="machine-top"><span>方方街机</span></div>
            <button class="machine-screen" id="machine-screen" type="button" aria-label="开始当前游戏" disabled>
              <span class="machine-screen-cover" id="machine-screen-cover" aria-hidden="true"></span>
              <div class="scanlines"></div>
              <span class="screen-kicker" id="machine-screen-kicker">READY?</span>
              <strong id="machine-screen-title">FIGHT!</strong>
              <small id="machine-screen-prompt">CHOOSE YOUR GAME</small>
            </button>
            <div class="machine-controls" aria-label="街机控制台">
              <div class="joystick-navigation">
                <button id="machine-previous" type="button" aria-label="上一款游戏">‹</button>
                <span class="joystick" aria-hidden="true"></span>
                <button id="machine-next" type="button" aria-label="下一款游戏">›</button>
              </div>
              <button class="machine-action machine-random" id="machine-random" type="button" aria-label="随机选择游戏">?</button>
              <button class="machine-action machine-start" id="machine-start" type="button" disabled>开始</button>
            </div>
          </section>
        </div>

        <section class="library" id="library">
          <div class="resource-notice" id="resource-notice" hidden>
            <span>!</span>
            <p><strong>还没有找到可运行的 ROM。</strong> 上传完整游戏目录后，页面会自动发现，也可以点击刷新。</p>
            <button type="button" id="show-setup">查看目录</button>
          </div>

          <div class="game-grid" id="game-grid" aria-live="polite">
            <div class="skeleton-card"></div>
            <div class="skeleton-card"></div>
          </div>

          <p class="empty-state" id="empty-state" hidden>ROM 目录中没有可显示的游戏。</p>
        </section>
      </section>

      <section class="setup-panel" id="setup" hidden>
        <button class="close-button" id="close-setup" type="button" aria-label="关闭">×</button>
        <p class="eyebrow">RESOURCE MAPPING</p>
        <h2>挂载你的游戏资源</h2>
        <div class="path-list">
          <code>runtime/游戏名称/roms/</code><span>一个主游戏 ZIP</span>
          <code>runtime/游戏名称/bios/</code><span>该游戏自己的 BIOS</span>
          <code>runtime/游戏名称/covers/</code><span>可选的游戏封面</span>
        </div>
        <p>ROM 会从目录自动识别，无需编辑清单。请使用与 FBNeo 4.2.3 匹配且你有权使用的 romset。</p>
      </section>
    </main>

    <script type="module" src="/assets/app.js"></script>
  </body>
</html>
